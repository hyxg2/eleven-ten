<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dceeff, #a8d4ff, #eaf5ff);
      font-family: "Trebuchet MS", sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .intro {
      color: #285a91;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    h2 {
      color: #24588c;
      font-size: 23px;
      margin-bottom: 30px;
    }

    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 185px;
      margin: 0 auto 28px;
      cursor: pointer;
      perspective: 1000px;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope {
      position: absolute;
      inset: 0;
      background: #4b91d8;
      border-radius: 5px;
      box-shadow: 0 12px 25px rgba(35, 94, 151, 0.22);
    }

    .envelope::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #78b8f4;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      z-index: 4;
      transform-origin: top;
      transition: transform 0.7s ease;
      border-radius: 5px;
    }

    .envelope::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #397fc2;
      clip-path: polygon(0 100%, 0 0, 50% 55%, 100% 0, 100% 100%);
      z-index: 3;
      border-radius: 5px;
    }

    .letter {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      height: 155px;
      padding: 22px 10px;
      background: #ffffff;
      border-radius: 5px;
      color: #285a91;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      z-index: 2;
      opacity: 0;
      visibility: hidden;
      transition:
        transform 0.8s ease,
        opacity 0.5s ease,
        visibility 0.5s;
    }

    .letter p {
      font-size: 19px;
      line-height: 1.7;
      margin: 8px 0;
    }

    .envelope-wrapper.open .letter {
      opacity: 1;
      visibility: visible;
      transform: translateY(-115px);
      transition-delay: 0.45s;
    }

    .envelope-wrapper.open .envelope::before {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .hint {
      color: #285a91;
      font-size: 14px;
      min-height: 24px;
      margin-top: 125px;
    }

    .envelope-wrapper.open {
      cursor: default;
    }

    @media (max-width: 360px) {
      .envelope-wrapper {
        width: 250px;
        height: 170px;
      }

      .letter p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <p class="intro">
      well saw a reel on ig and got inspired but rather than sending that lemme do sometng extra lol
    </p>

    <h2>tap the letter</h2>

    <div
      class="envelope-wrapper"
      id="envelope"
      role="button"
      tabindex="0"
      aria-label="open the letter"
      onclick="openLetter()"
      onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openLetter(); }"
    >
      <div class="envelope"></div>

      <div class="letter">
        <p>are you today's date???</p>
        <p>cuz u r 11/10 ;)</p>
      </div>
    </div>

    <p class="hint" id="hint">tap the damn envelope</p>

    <audio id="song" preload="auto">
      <source src="Tadow.mp3" type="audio/mpeg">
    </audio>

  </div>

  <script>
    let opened = false;

    function openLetter() {
      if (opened) return;

      opened = true;

      document.getElementById("envelope").classList.add("open");
      document.getElementById("hint").textContent = "hehee i luv u ";

      const song = document.getElementById("song");

      song.play().catch(() => {
        // If playback is blocked, the letter still opens normally.
      });
    }
  </script>
</body>
</html>
